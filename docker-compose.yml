services:
  # Runs the full pipeline: raw CSV -> hourly features -> trained models + metrics
  train:
    build: .
    command: sh -c "python pipeline.py && python train.py"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    profiles: ["train"]

  # Serves the trained model at http://localhost:8000
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
